[project]
name = "automotive-testcase-generator"
version = "0.1.0"
description = "LLM-assisted automotive test case generation pipeline (Gemini + LangGraph + Qdrant)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain-google-genai",
    "langchain-core",
    "qdrant-client",
    "pandas",
    "openpyxl",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "numpy",
    "PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
