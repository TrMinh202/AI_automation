# Mapping ten cot Excel -> field chuan he thong.
# File nay dung cho VF34_update.xlsx (sheet Body_Testcases, header row 0).
# Khi doi file Excel khac, copy file nay, sua gia tri ben phai va truyen --mapping vao lenh ingest.
sheet_name: "Body_Testcases"
header_row: 1

columns:
  feature: "Functional Requirement Category"
  trigger: "Power State"
  vehicle_status: "Vehicle Status"
  domain: "Domain"
  title: "Name"
  preconditions: "Pre-Action"
  steps_action: "Test Steps.Action"
  steps_expected: "Test Steps.Expected result"
  final_expected_result: "Test Purpose"

# Chi bo qua dong neu thieu ca hai truong nay; cac truong khac co the rong.
required_fields:
  - domain
  - title

# Ky tu phan tach precondition trong cung mot cell.
list_delimiter: "\n"

# Regex de split steps (action va expected) theo boundary so buoc "1." "2." "3."
# Giu nguyen CAN signal detail lien ket voi buoc tuong ung.
step_split_regex: "\\n(?=\\d+\\.)"
